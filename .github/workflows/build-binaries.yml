name: Build Binaries

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_NAME: claude2api

concurrency:
  group: build-binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试
        run: go test ./...

  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            archive_ext: zip
          - goos: windows
            goarch: arm64
            archive_ext: zip
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建二进制包
        env:
          RAW_REF_NAME: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${RAW_REF_NAME//\//-}"
          VERSION="${REF_NAME}-${GITHUB_SHA::7}"
          ./scripts/package-binary.sh "${APP_NAME}" "${VERSION}" "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ matrix.archive_ext }}"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: binary_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/${{ env.APP_NAME }}_*_${{ matrix.goos }}_${{ matrix.goarch }}/${{ env.APP_NAME }}_*_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: Collect Checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          pattern: binary_*
          path: dist
          merge-multiple: true

      - name: 生成校验文件
        env:
          RAW_REF_NAME: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          REF_NAME="${RAW_REF_NAME//\//-}"
          VERSION="${REF_NAME}-${GITHUB_SHA::7}"
          CHECKSUM_FILE="${APP_NAME}_${VERSION}_checksums.txt"

          cd dist
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print0 | sort -z | xargs -0 sha256sum > "${CHECKSUM_FILE}"

      - name: 上传校验文件
        uses: actions/upload-artifact@v4
        with:
          name: binary_checksums
          path: dist/*.txt
          if-no-files-found: error
          retention-days: 14
