name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  APP_NAME: c2c

concurrency:
  group: publish-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 运行测试
        run: go test ./...

  build:
    name: Release ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            archive_ext: zip
          - goos: windows
            goarch: arm64
            archive_ext: zip
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: 构建发布包
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          ./scripts/package-binary.sh "${APP_NAME}" "${VERSION}" "${{ matrix.goos }}" "${{ matrix.goarch }}" "${{ matrix.archive_ext }}"

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: release_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/${{ env.APP_NAME }}_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}/${{ env.APP_NAME }}_${{ github.ref_name }}_${{ matrix.goos }}_${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载发布产物
        uses: actions/download-artifact@v4
        with:
          pattern: release_*
          path: dist
          merge-multiple: true

      - name: 生成校验文件
        shell: bash
        run: |
          set -euo pipefail

          cd dist
          CHECKSUM_FILE="${APP_NAME}_${GITHUB_REF_NAME}_checksums.txt"
          find . -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" \) -print0 | sort -z | xargs -0 sha256sum > "${CHECKSUM_FILE}"

      - name: 发布到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
