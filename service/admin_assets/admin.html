<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Claude2API 控制台（简化版）</title>
    <style>
      :root {
        --bg0: #070a12;
        --border: rgba(255, 255, 255, 0.1);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.65);
        --muted2: rgba(255, 255, 255, 0.45);
        --good: #22c55e;
        --bad: #ef4444;
        --warn: #f59e0b;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Helvetica Neue", Arial;
        background: radial-gradient(1000px 600px at 25% 20%, rgba(59, 130, 246, 0.18), transparent 60%),
          radial-gradient(900px 500px at 70% 30%, rgba(168, 85, 247, 0.14), transparent 60%),
          radial-gradient(1100px 700px at 40% 90%, rgba(34, 197, 94, 0.1), transparent 55%), var(--bg0);
      }

      .container {
        max-width: 1100px;
        margin: 28px auto;
        padding: 0 16px 28px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border: 1px solid var(--border);
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.08), rgba(255, 255, 255, 0.04));
        border-radius: 14px;
        backdrop-filter: blur(10px);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .logo {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: conic-gradient(from 180deg, #7c3aed, #2563eb, #22c55e, #f59e0b, #ef4444, #7c3aed);
      }
      .title {
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      .sub {
        font-size: 12px;
        color: var(--muted2);
        margin-top: 2px;
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        padding: 8px 10px;
        border-radius: 10px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.09);
      }
      .btn.sm {
        padding: 6px 10px;
        font-size: 12px;
        border-radius: 10px;
      }
      .btn.primary {
        border-color: rgba(106, 168, 255, 0.45);
        background: rgba(106, 168, 255, 0.18);
      }
      .btn.primary:hover {
        background: rgba(106, 168, 255, 0.22);
      }
      .btn.ghost {
        background: rgba(255, 255, 255, 0.04);
      }

      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
        margin-top: 14px;
      }

      .card {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(10px);
      }
      .card h2 {
        margin: 0;
        padding: 14px 16px 10px;
        font-size: 14px;
        color: var(--muted);
      }
      .card .content {
        padding: 0 16px 16px;
      }

      .kpi-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      @media (max-width: 900px) {
        .kpi-row {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      .kpi {
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.2);
        border-radius: 14px;
        padding: 12px;
      }
      .kpi .label {
        color: var(--muted2);
        font-size: 12px;
      }
      .kpi .value {
        font-size: 22px;
        font-weight: 700;
        margin-top: 6px;
      }
      .kpi .hint {
        color: var(--muted2);
        font-size: 12px;
        margin-top: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .accounts {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .pool-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 14px;
      }
      .pool-card {
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(10px);
      }
      .pool-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 14px 16px 10px;
        color: var(--muted);
        font-size: 14px;
      }
      .pool-sub {
        color: var(--muted2);
        font-size: 12px;
        margin-top: 4px;
      }
      .pool-body {
        padding: 0 16px 16px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
        gap: 12px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .pool-body {
          grid-template-columns: 1fr;
        }
      }

      .acc {
        padding: 14px 14px 12px;
        display: grid;
        gap: 10px;
      }
      .acc-top {
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: start;
        gap: 10px;
      }
      .acc-title {
        display: flex;
        flex-direction: column;
        gap: 4px;
        min-width: 0;
        overflow: hidden;
      }
      .acc-name {
        font-weight: 700;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .acc-meta {
        color: var(--muted2);
        font-size: 12px;
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--muted);
        font-size: 12px;
        flex: 0 0 auto;
        white-space: nowrap;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: var(--muted2);
      }
      .badge.good {
        border-color: rgba(34, 197, 94, 0.35);
        background: rgba(34, 197, 94, 0.12);
        color: rgba(209, 250, 229, 0.9);
      }
      .badge.good .dot {
        background: var(--good);
      }
      .badge.bad {
        border-color: rgba(239, 68, 68, 0.35);
        background: rgba(239, 68, 68, 0.12);
        color: rgba(254, 226, 226, 0.9);
      }
      .badge.bad .dot {
        background: var(--bad);
      }
      .badge.warn {
        border-color: rgba(245, 158, 11, 0.35);
        background: rgba(245, 158, 11, 0.12);
        color: rgba(255, 237, 213, 0.92);
      }
      .badge.warn .dot {
        background: var(--warn);
      }

      .pills {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(0, 0, 0, 0.18);
        font-size: 12px;
        color: var(--muted);
      }
      .pill strong {
        color: var(--text);
        font-weight: 800;
      }
      .pill.ok strong {
        color: rgba(209, 250, 229, 0.95);
      }
      .pill.fail strong {
        color: rgba(254, 226, 226, 0.95);
      }
      .pill.rate {
        background: rgba(245, 158, 11, 0.1);
        border-color: rgba(245, 158, 11, 0.3);
      }

      .spark {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .sparkline {
        flex: 1 1 auto;
        min-width: 0;
        max-width: 416px; /* 30*10 + 29*4 = 416 */
        display: grid;
        grid-template-columns: repeat(30, minmax(0, 1fr));
        gap: 4px;
        align-items: center;
      }
      .sq {
        width: 100%;
        aspect-ratio: 1 / 1;
        border-radius: 3px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.1);
      }
      .sq.ok {
        background: rgba(34, 197, 94, 0.9);
        border-color: rgba(34, 197, 94, 0.55);
      }
      .sq.fail {
        background: rgba(239, 68, 68, 0.9);
        border-color: rgba(239, 68, 68, 0.55);
      }
      .sq.none {
        background: rgba(255, 255, 255, 0.08);
      }

      .toggle {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-size: 13px;
        user-select: none;
      }
      .switch {
        width: 44px;
        height: 24px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        border: 1px solid var(--border);
        position: relative;
        cursor: pointer;
      }
      .knob {
        width: 20px;
        height: 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.88);
        position: absolute;
        top: 1px;
        left: 1px;
        transition: left 160ms ease;
      }
      .switch.on {
        background: rgba(34, 197, 94, 0.2);
        border-color: rgba(34, 197, 94, 0.35);
      }
      .switch.on .knob {
        left: 21px;
      }

      .modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
      }
      .modal.show {
        display: flex;
      }
      .dialog {
        width: min(720px, 100%);
        border: 1px solid var(--border);
        border-radius: 16px;
        background: rgba(10, 14, 24, 0.96);
        backdrop-filter: blur(12px);
        padding: 14px;
      }
      .dialog h3 {
        margin: 6px 4px 10px;
        font-size: 14px;
        color: var(--muted);
      }
      .form {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      @media (max-width: 760px) {
        .form {
          grid-template-columns: 1fr;
        }
      }
      .field {
        display: grid;
        gap: 6px;
      }
      .field label {
        font-size: 12px;
        color: var(--muted2);
      }
      .field input,
      .field textarea {
        width: 100%;
        padding: 10px 10px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        outline: none;
      }
      .field textarea {
        min-height: 78px;
        resize: vertical;
        grid-column: 1 / -1;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 10px;
      }
      .toast {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0, 0, 0, 0.55);
        border: 1px solid var(--border);
        padding: 10px 12px;
        border-radius: 12px;
        color: var(--text);
        font-size: 13px;
        display: none;
      }
      .toast.show {
        display: block;
      }

      .btn.loading {
        pointer-events: none;
        opacity: 0.6;
      }
      .btn.loading::after {
        content: "";
        width: 14px;
        height: 14px;
        border: 2px solid transparent;
        border-top-color: currentColor;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin-left: 6px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .switch.loading {
        pointer-events: none;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <div class="brand">
          <div class="logo" aria-hidden="true"></div>
          <div>
            <div class="title">Claude2API 控制台（简化版）</div>
            <div class="sub">账号状态 · 调用统计 · 账号备注/添加</div>
          </div>
        </div>
        <div class="toolbar">
          <button class="btn" id="btnAdd" type="button">添加 Session</button>
          <button class="btn" id="btnRefresh" type="button">立即刷新</button>
          <label class="btn" style="display: inline-flex; align-items: center; gap: 8px; user-select: none">
            <input id="autoRefresh" type="checkbox" style="accent-color: #6aa8ff" />
            自动刷新（30 秒）
          </label>
        </div>
      </header>

      <div class="grid">
        <section class="card">
          <h2>全局概览</h2>
          <div class="content">
            <div class="kpi-row">
              <div class="kpi">
                <div class="label">成功率</div>
                <div class="value" id="kpiRate">--</div>
                <div class="hint" id="kpiLastAt">最近：--</div>
              </div>
              <div class="kpi">
                <div class="label">成功</div>
                <div class="value" id="kpiOk">--</div>
                <div class="hint" id="kpiLastOk">最近成功：--</div>
              </div>
              <div class="kpi">
                <div class="label">失败</div>
                <div class="value" id="kpiFail">--</div>
                <div class="hint" id="kpiLastErr">最近错误：--</div>
              </div>
              <div class="kpi">
                <div class="label">账号数</div>
                <div class="value" id="kpiAccounts">--</div>
                <div class="hint" id="kpiEnabled">启用：--</div>
              </div>
            </div>
            <div class="hint" id="egressInfo" style="margin-top: 10px">出口IP：--</div>
          </div>
        </section>

        <section class="card">
          <h2>账号列表</h2>
          <div class="content">
            <div class="accounts" id="accounts"></div>
          </div>
        </section>
      </div>
    </div>

    <div class="modal" id="modal">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
        <h3 id="dlgTitle">添加 Session</h3>
        <div class="form">
          <div class="field">
            <label>名称（可选）</label>
            <input id="inName" placeholder="例如：主号/备用号" />
          </div>
          <div class="field">
            <label>账号（可选）</label>
            <input id="inAccount" placeholder="例如：xxx@gmail.com" />
          </div>
          <div class="field">
            <label>账号池（必选）</label>
            <select
              id="inPool"
              style="
                width: 100%;
                padding: 10px 10px;
                border-radius: 12px;
                border: 1px solid var(--border);
                background: rgba(255, 255, 255, 0.06);
                color: var(--text);
                outline: none;
              "
            >
              <option value="low">低权重池（用于 Claude 4）</option>
              <option value="high">正常权重池（用于 4.5 / haiku）</option>
            </select>
          </div>
          <div class="field" style="grid-column: 1 / -1">
            <label>sessionKey（必填）</label>
            <textarea id="inSession" placeholder="sk-ant-sid01-..."></textarea>
          </div>
          <div class="field">
            <label>OrgID（可选）</label>
            <input id="inOrg" placeholder="留空可自动获取" />
          </div>
        </div>
        <div class="dialog-actions">
          <button class="btn" id="btnCancel" type="button">取消</button>
          <button class="btn" id="btnSubmit" type="button">保存</button>
        </div>
      </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
      const $ = (id) => document.getElementById(id);
      const AUTO_REFRESH_LS_KEY = "claude2api_admin_autorefresh_v1";
      let autoRefreshTimer = null;
      let autoRefreshFailStreak = 0;

      function fmtPct(x) {
        if (typeof x !== "number" || Number.isNaN(x)) return "--";
        return (x * 100).toFixed(1) + "%";
      }
      function fmtInt(x) {
        if (typeof x !== "number" || Number.isNaN(x)) return "--";
        return String(x);
      }
      function fmtTime(iso) {
        if (!iso) return "--";
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return "--";
        return d.toLocaleString();
      }
      function safeStr(s) {
        return (s == null ? "" : String(s)).slice(0, 120);
      }

      function showToast(msg) {
        const t = $("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
      }

      function setLoading(el, loading, text) {
        if (!el) return;
        if (loading) {
          el.classList.add("loading");
          el.disabled = true;
          if (text) el.dataset.origText = el.textContent, el.textContent = text;
        } else {
          el.classList.remove("loading");
          el.disabled = false;
          if (el.dataset.origText) el.textContent = el.dataset.origText, delete el.dataset.origText;
        }
      }

      function statusBadge(a) {
        if (!a.enabled || a.status === "禁用") return { cls: "warn", text: "禁用" };
        if (a.status === "冷却") return { cls: "warn", text: "冷却" };
        if (a.status === "异常") return { cls: "bad", text: "异常" };
        return { cls: "good", text: "活跃" };
      }

      function render(data) {
        const g = data.global || {};
        const accounts = data.accounts || [];
        const low = accounts.filter((a) => (a.pool || "low") === "low");
        const high = accounts.filter((a) => (a.pool || "low") === "high");
        const lowEnabled = low.filter((a) => a.enabled).length;
        const highEnabled = high.filter((a) => a.enabled).length;

        $("kpiRate").textContent = fmtPct(g.successRate);
        $("kpiOk").textContent = fmtInt(g.ok);
        $("kpiFail").textContent = fmtInt(g.fail);
        $("kpiAccounts").textContent = fmtInt(accounts.length);
        $("kpiLastAt").textContent = "最近：" + fmtTime(g.lastAt);
        $("kpiLastOk").textContent = "最近成功：" + fmtTime(g.lastOkAt);
        $("kpiLastErr").textContent = "最近错误：" + (g.lastError ? safeStr(g.lastError) : "--");
        $("kpiEnabled").textContent =
          "启用：" +
          fmtInt(accounts.filter((a) => a.enabled).length) +
          `（low: ${lowEnabled}/${low.length}，high: ${highEnabled}/${high.length}）`;

        const v4 = g.egressIPv4 || "";
        const v6 = g.egressIPv6 || "";
        const at = g.egressAt ? fmtTime(g.egressAt) : "--";
        if (v4 || v6) {
          $("egressInfo").textContent = `出口IP：v4=${v4 || "无"}，v6=${v6 || "无"}（${at}）`;
        } else if (g.egressError) {
          $("egressInfo").textContent = `出口IP：获取失败（${safeStr(g.egressError)}）`;
        } else {
          $("egressInfo").textContent = "出口IP：--";
        }

        const wrap = $("accounts");
        wrap.innerHTML = `
          <div class="pool-grid">
            <div class="pool-card">
              <div class="pool-head">
                <div>
                  <div>低权重池（Claude 4）</div>
                  <div class="pool-sub">当请求模型为 Claude 4 时从此池轮询</div>
                </div>
                <div style="text-align:right">
                  <div class="pool-sub" id="poolLowCount">--</div>
                </div>
              </div>
              <div class="pool-body" id="poolLow"></div>
            </div>
            <div class="pool-card">
              <div class="pool-head">
                <div>
                  <div>正常权重池（4.5 / haiku）</div>
                  <div class="pool-sub">当请求模型为 4.5/haiku 时从此池轮询</div>
                </div>
                <div style="text-align:right">
                  <div class="pool-sub" id="poolHighCount">--</div>
                </div>
              </div>
              <div class="pool-body" id="poolHigh"></div>
            </div>
          </div>
        `;

        const lowWrap = $("poolLow");
        const highWrap = $("poolHigh");
        $("poolLowCount").textContent = `${lowEnabled}/${low.length}`;
        $("poolHighCount").textContent = `${highEnabled}/${high.length}`;

        function addAccountCard(a) {
          const badge = statusBadge(a);
          const ok = a.ok || 0;
          const fail = a.fail || 0;
          const rate = a.successRate ?? ((ok + fail) > 0 ? ok / (ok + fail) : 0);
          const recent = Array.isArray(a.recent) ? a.recent : [];

          const squares = [];
          for (let i = 0; i < 30; i++) {
            const v = recent[i];
            if (v === true) squares.push(`<span class="sq ok" title="成功"></span>`);
            else if (v === false) squares.push(`<span class="sq fail" title="失败"></span>`);
            else squares.push(`<span class="sq none" title="无数据"></span>`);
          }

          const el = document.createElement("div");
          el.className = "card acc";
          el.innerHTML = `
            <div class="acc-top">
              <div class="acc-title">
                <div class="acc-name">${safeStr(a.name || a.account || a.maskedKey || "sk-****")}</div>
                <div class="acc-meta">
                  <span>Key：${safeStr(a.maskedKey || "")}</span>
                  <span>账号：${safeStr(a.account || "未填写")}</span>
                  <span>池：${safeStr(a.pool || "low")}</span>
                  <span>最近：${fmtTime(a.lastAt)}</span>
                  <span>连续失败：${fmtInt(a.failStreak || 0)}</span>
                  <span>错误：${a.lastError ? safeStr(a.lastError) : "无"}</span>
                  <span>${a.cooldownUntil ? ("恢复：" + fmtTime(a.cooldownUntil)) : ""}</span>
                  <span>
                    识别：${a.classifyReportedModel ? safeStr(a.classifyReportedModel) : "--"}
                    ${a.classifySuggestedPool ? ("→建议池：" + safeStr(a.classifySuggestedPool)) : ""}
                    ${a.classifyLastAt ? ("（" + fmtTime(a.classifyLastAt) + "）") : ""}
                    ${a.classifyError ? ("｜" + safeStr(a.classifyError)) : ""}
                  </span>
                </div>
              </div>
              <span class="badge ${badge.cls}">
                <span class="dot"></span>
                <span>${badge.text}</span>
              </span>
            </div>

            <div class="pills">
              <span class="pill ok">成功：<strong>${ok}</strong></span>
              <span class="pill fail">失败：<strong>${fail}</strong></span>
              <span class="pill rate">成功率：<strong>${(rate * 100).toFixed(1)}%</strong></span>
            </div>

            <div class="spark">
              <div class="sparkline" aria-label="最近调用记录">${squares.join("")}</div>
              <span class="pill" style="padding: 6px 10px">${(rate * 100).toFixed(1)}%</span>
            </div>

            <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
                <select class="poolSel" data-id="${a.id}" style="padding: 6px 10px; border-radius: 10px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: var(--text)">
                  <option value="low">low（Claude 4）</option>
                  <option value="high">high（4.5/haiku）</option>
                </select>
                <button class="btn sm ghost btnSavePool" data-id="${a.id}" type="button">保存池</button>
                <button class="btn sm primary btnClassify" data-id="${a.id}" type="button">自动识别</button>
                <button class="btn sm btnClassifyApply" data-id="${a.id}" type="button">识别并应用</button>
                <button class="btn sm ghost btnDelete" data-id="${a.id}" type="button">删除</button>
              </div>
              <label class="toggle">
                <span>启用</span>
                <span class="switch ${a.enabled ? "on" : ""}" data-id="${a.id}">
                  <span class="knob"></span>
                </span>
              </label>
            </div>
          `;

          // pool selector default
          const sel = el.querySelector(".poolSel");
          if (sel) sel.value = (a.pool || "low");

          el.querySelector(".btnSavePool").addEventListener("click", async (ev) => {
            const btn = ev.currentTarget;
            const id = btn.getAttribute("data-id");
            const pool = (el.querySelector(".poolSel")?.value || "low").trim();
            setLoading(btn, true, "保存中…");
            try {
              const res = await fetch(`/admin/sessions/${id}/pool`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ pool }),
              });
              if (res.status === 401) return (location.href = "/admin/login");
              if (res.status === 403) return (location.href = "/admin/setup");
              let body = null;
              try {
                body = await res.json();
              } catch (_) {}
              if (!res.ok) throw new Error((body && body.error) ? body.error : "HTTP " + res.status);
              showToast(body && body.savedPath ? ("已保存到 " + body.savedPath) : "已保存");
              await loadStatus();
            } catch (e) {
              showToast("保存失败：" + e.message);
            } finally {
              setLoading(btn, false);
            }
          });

          async function doClassify(apply, btn) {
            const id = a.id;
            setLoading(btn, true, apply ? "识别中…" : "识别中…");
            try {
              const res = await fetch(`/admin/sessions/${id}/auto-classify`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ apply: !!apply }),
              });
              if (res.status === 401) return (location.href = "/admin/login");
              if (res.status === 403) return (location.href = "/admin/setup");
              let body = null;
              try {
                body = await res.json();
              } catch (_) {}
              if (!res.ok) throw new Error((body && body.error) ? body.error : "HTTP " + res.status);
              if (body && body.ok) {
                showToast(`识别：${body.reportedModel}，建议池：${body.suggestedPool}`);
              } else {
                showToast("识别完成，但未成功：" + ((body && body.error) || "未知错误"));
              }
              await loadStatus();
            } catch (e) {
              showToast("识别失败：" + e.message);
            } finally {
              setLoading(btn, false);
            }
          }

          el.querySelector(".btnClassify").addEventListener("click", (ev) => doClassify(false, ev.currentTarget));
          el.querySelector(".btnClassifyApply").addEventListener("click", (ev) => doClassify(true, ev.currentTarget));

          el.querySelector(".btnDelete").addEventListener("click", async (ev) => {
            const btn = ev.currentTarget;
            const id = btn.getAttribute("data-id");
            if (!confirm("确定要删除该 session 吗？此操作会写入 config.yaml，且不可恢复。")) return;
            setLoading(btn, true, "删除中…");
            try {
              const res = await fetch(`/admin/sessions/${id}`, { method: "DELETE" });
              if (res.status === 401) return (location.href = "/admin/login");
              if (res.status === 403) return (location.href = "/admin/setup");
              let body = null;
              try {
                body = await res.json();
              } catch (_) {}
              if (!res.ok) throw new Error((body && body.error) ? body.error : "HTTP " + res.status);
              showToast(body && body.savedPath ? ("已删除，已保存到 " + body.savedPath) : "已删除");
              await loadStatus();
            } catch (e) {
              showToast("删除失败：" + e.message);
            } finally {
              setLoading(btn, false);
            }
          });

          el.querySelector(".switch").addEventListener("click", async (ev) => {
            const sw = ev.currentTarget;
            const id = sw.getAttribute("data-id");
            const enabled = !sw.classList.contains("on");
            sw.classList.add("loading");
            try {
              const res = await fetch(`/admin/sessions/${id}/toggle`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ enabled }),
              });
              if (res.status === 401) return (location.href = "/admin/login");
              if (res.status === 403) return (location.href = "/admin/setup");
              let body = null;
              try {
                body = await res.json();
              } catch (_) {}
              if (!res.ok) {
                const msg = (body && body.error) ? body.error : "HTTP " + res.status;
                throw new Error(msg);
              }
              showToast(body && body.savedPath ? ("已保存到 " + body.savedPath) : "已更新");
              await loadStatus();
            } catch (e) {
              showToast("更新失败：" + e.message);
            } finally {
              sw.classList.remove("loading");
            }
          });

          const target = (a.pool || "low") === "high" ? highWrap : lowWrap;
          target.appendChild(el);
        }

        for (const a of low) addAccountCard(a);
        for (const a of high) addAccountCard(a);
      }

      async function loadStatus() {
        const res = await fetch("/admin/status", { cache: "no-store" });
        if (res.status === 401) {
          location.href = "/admin/login";
          throw new Error("未登录");
        }
        if (res.status === 403) {
          location.href = "/admin/setup";
          throw new Error("未初始化");
        }
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        render(data);
      }

      function setAutoRefresh(enabled) {
        try {
          localStorage.setItem(AUTO_REFRESH_LS_KEY, enabled ? "1" : "0");
        } catch (_) {}

        if (autoRefreshTimer) {
          clearInterval(autoRefreshTimer);
          autoRefreshTimer = null;
        }
        autoRefreshFailStreak = 0;

        if (!enabled) return;
        autoRefreshTimer = setInterval(async () => {
          try {
            await loadStatus();
            autoRefreshFailStreak = 0;
          } catch (e) {
            autoRefreshFailStreak += 1;
            // 连续失败时再提示，避免刷屏
            if (autoRefreshFailStreak === 3) {
              showToast("自动刷新失败：" + e.message);
            }
          }
        }, 30 * 1000);
      }

      function openModal() {
        $("modal").classList.add("show");
      }
      function closeModal() {
        $("modal").classList.remove("show");
        $("inName").value = "";
        $("inAccount").value = "";
        $("inPool").value = "low";
        $("inSession").value = "";
        $("inOrg").value = "";
      }

      $("btnAdd").addEventListener("click", openModal);
      $("btnCancel").addEventListener("click", closeModal);
      $("modal").addEventListener("click", (e) => {
        if (e.target === $("modal")) closeModal();
      });

      $("btnSubmit").addEventListener("click", async () => {
        const btn = $("btnSubmit");
        const name = $("inName").value.trim();
        const account = $("inAccount").value.trim();
        const pool = ($("inPool").value || "").trim();
        const sessionKey = $("inSession").value.trim();
        const orgID = $("inOrg").value.trim();
        if (!sessionKey) {
          showToast("sessionKey 不能为空");
          return;
        }
        setLoading(btn, true, "保存中…");
        try {
          const res = await fetch("/admin/sessions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, account, pool, sessionKey, orgID }),
          });
          if (res.status === 401) return (location.href = "/admin/login");
          if (res.status === 403) return (location.href = "/admin/setup");
          let body = null;
          try {
            body = await res.json();
          } catch (_) {}
          if (!res.ok) {
            const msg = (body && body.error) ? body.error : "HTTP " + res.status;
            throw new Error(msg);
          }
          showToast(body && body.savedPath ? ("已添加，已保存到 " + body.savedPath) : "已添加");
          closeModal();
          await loadStatus();
        } catch (e) {
          showToast("添加失败：" + e.message);
        } finally {
          setLoading(btn, false);
        }
      });

      $("btnRefresh").addEventListener("click", async () => {
        const btn = $("btnRefresh");
        setLoading(btn, true, "刷新中…");
        try {
          await loadStatus();
          autoRefreshFailStreak = 0;
          showToast("已刷新");
        } catch (e) {
          showToast("刷新失败：" + e.message);
        } finally {
          setLoading(btn, false);
        }
      });

      (async () => {
        try {
          await loadStatus();
        } catch (e) {
          showToast("提示：请先完成初始化（/admin/setup）或登录（/admin/login）");
        }

        // 自动刷新开关（默认关闭）
        let enabled = false;
        try {
          enabled = localStorage.getItem(AUTO_REFRESH_LS_KEY) === "1";
        } catch (_) {}
        $("autoRefresh").checked = enabled;
        setAutoRefresh(enabled);
      })();

      $("autoRefresh").addEventListener("change", (e) => {
        setAutoRefresh(!!e.target.checked);
        showToast(e.target.checked ? "已开启自动刷新" : "已关闭自动刷新");
      });
    </script>
  </body>
</html>
