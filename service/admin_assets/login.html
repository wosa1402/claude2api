<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>管理后台登录</title>
    <style>
      :root {
        --bg: #0b1020;
        --card: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.12);
        --text: rgba(255, 255, 255, 0.92);
        --muted: rgba(255, 255, 255, 0.65);
        --primary: #6aa8ff;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(900px 600px at 20% 0%, rgba(106, 168, 255, 0.25), transparent 60%),
          radial-gradient(900px 600px at 80% 20%, rgba(131, 255, 198, 0.16), transparent 60%), var(--bg);
        color: var(--text);
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .card {
        width: min(520px, 100%);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
      }
      .title {
        font-size: 18px;
        font-weight: 700;
        margin-bottom: 6px;
      }
      .sub {
        color: var(--muted);
        font-size: 13px;
        margin-bottom: 14px;
        line-height: 1.5;
      }
      .field label {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 12px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        outline: none;
      }
      .row {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        margin-top: 14px;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.06);
        color: var(--text);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .btn.primary {
        border-color: rgba(106, 168, 255, 0.45);
        background: rgba(106, 168, 255, 0.18);
      }
      .toast {
        margin-top: 10px;
        color: #ffd08a;
        font-size: 13px;
        display: none;
      }
      .toast.show {
        display: block;
      }
      a {
        color: var(--primary);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="title">管理后台登录</div>
      <div class="sub">请输入管理后台密码。首次使用请先完成 <a href="/admin/setup">初始化设置</a>。</div>
      <div class="field">
        <label>密码</label>
        <input id="pw" type="password" placeholder="请输入密码" autocomplete="current-password" />
      </div>
      <div class="row">
        <button class="btn" id="btnGo" type="button">返回首页</button>
        <button class="btn primary" id="btnLogin" type="button">登录</button>
      </div>
      <div class="toast" id="toast"></div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      function show(msg) {
        $("toast").textContent = msg;
        $("toast").classList.add("show");
      }

      $("btnGo").addEventListener("click", () => (location.href = "/"));
      $("btnLogin").addEventListener("click", async () => {
        const password = $("pw").value.trim();
        if (!password) return show("密码不能为空");
        try {
          const res = await fetch("/admin/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password }),
          });
          let body = null;
          try {
            body = await res.json();
          } catch (_) {}
          if (!res.ok) throw new Error((body && body.error) || "HTTP " + res.status);
          location.href = "/admin";
        } catch (e) {
          show("登录失败：" + e.message);
        }
      });

      $("pw").addEventListener("keydown", (e) => {
        if (e.key === "Enter") $("btnLogin").click();
      });
    </script>
  </body>
</html>
